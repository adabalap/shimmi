[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    live: requires real LLM API keys (costs quota)
    integration: runs offline with mocked LLM

# Run offline tests by default:
#   pytest tests/unit/
#
# Run all mocked-LLM integration tests:
#   pytest tests/unit/ tests/integration/
#
# Run live (real API quota) tests:
#   pytest tests/live/ -m live
