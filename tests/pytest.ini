[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests/unit tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live: requires real LLM API keys (costs quota — opt-in only)
    integration: mocked-LLM integration test (fast, zero quota)
addopts = -q --tb=short
